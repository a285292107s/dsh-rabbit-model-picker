name: test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The test scripts were removed on 2026-10-18 by maintainer decision
      # (see AGENTS.md and DESIGN §5.43). What is left is the one thing a git
      # install actually depends on: the source type-checks and bundles.
      - run: npm run typecheck
      - run: npm run build
