name: test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Every gate in one pass (see the `test` script in package.json):
      #   typecheck   — tsc, including noUnusedLocals/Parameters
      #   build       — regenerate lib/
      #   test:fresh  — the COMMITTED lib/ must be a faithful build of the
      #                 COMMITTED src/, which is what a git install receives
      #   selfcheck   — static contracts, copy keys, a11y wiring
      #   contrast    — WCAG AA per painted style in both themes, measured
      #                 against scripts/theme-tokens.json here, since the host
      #                 is not installed on the runner
      #   test:params — the parameter/facts/panel-copy unit gate
      #   test:mutations — the gate ON the gates: each judgement is broken on
      #                 purpose and a gate has to go red. A mutation that no
      #                 longer applies FAILS this step rather than skipping,
      #                 which is how three of them sat unapplied unnoticed.
      - run: npm test
